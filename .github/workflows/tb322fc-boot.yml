name: TB322FC boot (kShimC)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "which stage to run"
        type: choice
        options: [tools, kernel, boot, linux, probe, armadaboot, all]
        default: tools
      stock_boot:
        description: "path to the 96MiB stock boot.img inside the repo"
        type: string
        default: "stock/boot.img"

jobs:
  tools:
    if: ${{ inputs.stage == 'tools' || inputs.stage == 'boot' || inputs.stage == 'linux' || inputs.stage == 'armadaboot' || inputs.stage == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-none-eabi \
            device-tree-compiler python3 python3-pip zstd xz-utils pkg-config
      - name: Prepare pinned runtime dependencies
        run: |
          set -eux
          K="$GITHUB_WORKSPACE/devices/lenovo-tb323fu/boot/kshim-success-source"
          cd "$K"
          pip3 install --break-system-packages kconfiglib==14.1.0
          # picolibc 1.8.11
          git clone --depth 1 --branch 1.8.11 https://github.com/picolibc/picolibc lib/picolibc
          # LVGL 9.2.2
          git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl third_party/lvgl
          # CrDK pinned commit
          git init -q lib/CrDK
          git -C lib/CrDK remote add origin https://github.com/Project-Aloha/CrDK
          git -C lib/CrDK fetch --depth 1 origin b6c3335136b7f6b28271917de11e8f11982975fc
          git -C lib/CrDK checkout -q FETCH_HEAD
          # libfdt from dtc
          git clone --depth 1 https://git.kernel.org/pub/scm/utils/dtc/dtc.git /tmp/dtc
          mkdir -p lib/libfdt/include
          cp /tmp/dtc/libfdt/*.c lib/libfdt/ 2>/dev/null || true
          cp /tmp/dtc/libfdt/*.h lib/libfdt/include/
          ls lib/libfdt | head
          ls lib/libfdt/include | head
          echo "--- versions ---"
          git -C lib/CrDK rev-parse HEAD
          git -C third_party/lvgl describe --tags --always
          git -C lib/picolibc describe --tags --always
      - name: Build MultiBootKernelPatcher + UnpackTool
        run: |
          set -eux
          cmake -S packages/kshim-tools/vendor/packer -B build-packer \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHIMS=OFF
          cmake --build build-packer --parallel
          mkdir -p out-tools
          find build-packer -maxdepth 2 -type f -perm -u+x | sort
          cp build-packer/MultiBootKernelPatcher out-tools/
          cp build-packer/UnpackTool out-tools/
          for f in packages/kshim-tools/vendor/repack_boot_v4.py packages/kshim-tools/vendor/avbtool.py; do
            [ -f "$f" ] && cp "$f" out-tools/ || echo "MISSING $f"
          done
          ls -la out-tools
      - name: Build kShimC runtime (4 MiB)
        run: |
          set -eux
          cd devices/lenovo-tb323fu/boot/kshim-success-source
          echo "=== submodules ==="
          ls lib/CrDK | head -5 || echo "CrDK MISSING"
          ls lib/picolibc | head -5 || echo "picolibc MISSING"
          ls third_party/lvgl | head -5 || echo "lvgl MISSING"
          ls configs/ | head -20
          python3 tools/build_runtime.py --config configs/tb322fc_android_defconfig \
            --out "$GITHUB_WORKSPACE/out-runtime" || {
              echo "=== configure.log ==="; cat "$GITHUB_WORKSPACE/out-runtime/configure.log" 2>/dev/null | tail -60
              echo "=== build.log ==="; cat "$GITHUB_WORKSPACE/out-runtime/build.log" 2>/dev/null | tail -60
              exit 1
            }
          ls -la "$GITHUB_WORKSPACE/out-runtime"
          test "$(stat -c%s "$GITHUB_WORKSPACE/out-runtime/kShimC.bin")" = "4194304"
      - uses: actions/upload-artifact@v4
        with:
          name: kshim-tools
          path: |
            out-tools/**
            out-runtime/**
          if-no-files-found: error

  kernel:
    if: ${{ inputs.stage == 'kernel' || inputs.stage == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev dwarves zstd xz-utils cpio kmod \
            device-tree-compiler python3 git
      - name: Build kernel 7.2.6 + elden DTS
        run: |
          set -eux
          source packages/kernel/BASE.env
          export KERNEL_VERSION="$VERSION"
          export WORK_DIR="$RUNNER_TEMP/kbuild"
          export OUT_DIR="$GITHUB_WORKSPACE/out-kernel"
          bash packages/kernel/scripts/build-kernel.sh
          ls -la "$OUT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out-kernel/**
          if-no-files-found: error

  boot:
    if: ${{ inputs.stage == 'boot' || inputs.stage == 'all' }}
    runs-on: ubuntu-24.04
    needs: [tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kshim-tools
          path: in
      - name: Fetch kernel package
        run: |
          set -eux
          mkdir -p kern
          curl -fL --retry 5 -o kern/kernel.tar.zst \
            "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/armada-kernel-7.2.6.tar.zst"
          ls -la kern/
      - name: Fetch stock boot.img
        run: |
          set -eux
          mkdir -p stock
          if [ ! -f "${{ inputs.stock_boot }}" ]; then
            curl -fL --retry 5 -o "${{ inputs.stock_boot }}" \
              "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/boot.img"
          fi
          ls -la stock/
          stat -c%s "${{ inputs.stock_boot }}"
      - name: Inspect inputs
        run: |
          set -eux
          find in kern -maxdepth 3 | head -50
          ls -la "${{ inputs.stock_boot }}"
      - name: Install packer deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 zstd
      - name: Unpack kernel package
        run: |
          set -eux
          mkdir -p kroot
          t=$(ls kern/*.tar.zst)
          tar --use-compress-program=unzstd -xf "$t" -C kroot
          find kroot -name 'vmlinuz' -o -name '*.dtb' | head -20
      - name: Pack Android-only kShim boot
        run: |
          set -eux
          chmod +x in/out-tools/MultiBootKernelPatcher in/out-tools/UnpackTool
          sudo apt-get install -y --no-install-recommends python3
          # 菜单超时 8s 太短，改成 30s 方便真机交互
          sed -i 's/^TIMEOUT_MS = 8000$/TIMEOUT_MS = 30000/' devices/lenovo-tb322fc/boot/build_android_boot.py
          grep -n '^TIMEOUT_MS' devices/lenovo-tb322fc/boot/build_android_boot.py
          python3 devices/lenovo-tb322fc/boot/build_android_boot.py \
            --stock-boot "${{ inputs.stock_boot }}" \
            --runtime in/out-runtime/kShimC.bin \
            --packer in/out-tools/MultiBootKernelPatcher \
            --unpacker in/out-tools/UnpackTool \
            --avbtool in/out-tools/avbtool.py \
            --out out-boot
          ls -la out-boot
      - uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: out-boot/**
          if-no-files-found: error

  linux:
    if: ${{ inputs.stage == 'linux' || inputs.stage == 'all' }}
    runs-on: ubuntu-24.04
    needs: [tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kshim-tools
          path: in
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 zstd device-tree-compiler cpio busybox-static
      - name: Fetch kernel + stock boot
        run: |
          set -eux
          mkdir -p kern stock
          curl -fL --retry 5 -o kern/kernel.tar.zst \
            "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/armada-kernel-7.2.6.tar.zst"
          curl -fL --retry 5 -o stock/boot.img \
            "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/boot.img"
          curl -fL --retry 5 -o kShimC-fast.bin \
            "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/kShimC-fast.bin"
          ls -la kShimC-fast.bin
          mkdir -p kroot
          tar --use-compress-program=unzstd -xf kern/kernel.tar.zst -C kroot
          cp kroot/lib/modules/7.2.6/vmlinuz vmlinuz
          cp kroot/lib/modules/7.2.6/dtb/qcom/sm8750-lenovo-elden.dtb elden.dtb
          ls -la vmlinuz elden.dtb stock/boot.img
      - name: Build minimal initramfs (static aarch64 init)
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rm -rf irdir && mkdir -p irdir/dev irdir/proc irdir/sys
          aarch64-linux-gnu-gcc -static -O2 -o irdir/init .ci/tb322fc-init.c
          aarch64-linux-gnu-readelf -h irdir/init | grep -E 'Class|Machine|Type'
          sudo mknod irdir/dev/console c 5 1
          sudo mknod irdir/dev/null c 1 3
          sudo chmod 600 irdir/dev/console
          sudo chmod 666 irdir/dev/null
          chmod 0755 irdir/init
          (cd irdir && find . | cpio -o -H newc --quiet | gzip -9) > initrd.gz
          ls -la initrd.gz
      - name: Pack maintenance-layout boot (Android + Linux)
        run: |
          set -eux
          chmod +x in/out-tools/MultiBootKernelPatcher in/out-tools/UnpackTool
          python3 system_files/usr/libexec/armada/kshim-build-boot.py \
            --layout maintenance \
            --stock-boot stock/boot.img \
            --linux-image vmlinuz \
            --dtb elden.dtb \
            --initrd initrd.gz \
            --runtime kShimC-fast.bin \
            --packer in/out-tools/MultiBootKernelPatcher \
            --unpacker in/out-tools/UnpackTool \
            --repacker in/out-tools/repack_boot_v4.py \
            --avbtool in/out-tools/avbtool.py \
            --bootargs "console=tty0 loglevel=8 ignore_loglevel" \
            --out out-linux 2>&1 | tail -40
          ls -la out-linux
      - uses: actions/upload-artifact@v4
        with:
          name: boot-image-linux
          path: out-linux/**
          if-no-files-found: error

  probe:
    if: ${{ inputs.stage == 'probe' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/lib/android \
                      /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go || true
          sudo apt-get clean
          df -h /
      - name: Download disk image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          rid=39543239345
          aid=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${rid}/artifacts" \
                | jq -r '.artifacts[] | select(.name=="armada-disk-image") | .id')
          echo "artifact=${aid}"
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${aid}/zip" -o disk.zip
          ls -la disk.zip
      - name: Unpack image
        run: |
          set -eux
          unzip -o disk.zip
          gunzip -f armada-*.img.gz
          ls -la *.img
          sudo losetup -Pf --show armada-*.img
          lsblk -o NAME,SIZE,FSTYPE,LABEL
      - name: Extract /boot
        run: |
          set -eux
          loop=$(losetup -j armada-*.img | cut -d: -f1 | head -1)
          sudo mkdir -p /mnt/armada-boot
          sudo mount "${loop}p2" /mnt/armada-boot
          echo "=== tree ==="
          sudo find /mnt/armada-boot -maxdepth 3 | head -60
          echo "=== loader entries ==="
          sudo sh -c 'for f in /mnt/armada-boot/loader/entries/*.conf; do echo "--- $f"; cat "$f"; done' || true
          echo "=== modules dir ==="
          sudo ls -la /mnt/armada-boot/ 2>/dev/null || true
          mkdir -p bootfiles
          sudo cp -a /mnt/armada-boot/. bootfiles/ || true
          sudo chown -R "$(id -u):$(id -g)" bootfiles
          du -sh bootfiles
      - uses: actions/upload-artifact@v4
        with:
          name: armada-boot-files
          path: bootfiles/**
          if-no-files-found: error

  armadaboot:
    if: ${{ inputs.stage == 'armadaboot' }}
    runs-on: ubuntu-24.04
    needs: [tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kshim-tools
          path: in
      - name: Download image /boot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          rid=39550969566
          aid=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${rid}/artifacts" \
                | jq -r '.artifacts[] | select(.name=="armada-boot-files") | .id')
          echo "artifact=${aid}"
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${aid}/zip" -o boot.zip
          unzip -o boot.zip -d bootfiles
          find bootfiles -maxdepth 3 -name 'vmlinuz*' -o -maxdepth 3 -name 'initramfs*' | head
      - name: Fetch stock boot + runtime
        run: |
          set -eux
          curl -fL --retry 5 -o stock_boot.img \
            "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/boot.img"
          curl -fL --retry 5 -o kShimC-fast.bin \
            "https://github.com/Lianghao93/armadaos-freedom/releases/download/boot-assets/kShimC-fast.bin"
          ls -la stock_boot.img kShimC-fast.bin
      - name: Pack ArmadaOS boot entry
        run: |
          set -eux
          chmod +x in/out-tools/MultiBootKernelPatcher in/out-tools/UnpackTool
          K=$(dirname "$(find bootfiles -name 'vmlinuz-7.2.6' | head -1)")
          echo "kernel dir: ${K}"
          cp "${K}/vmlinuz-7.2.6" vmlinuz
          cp "${K}/initramfs-7.2.6.img" initrd.cpio
          cp "${K}/dtb/qcom/sm8750-lenovo-elden.dtb" elden.dtb
          ls -la vmlinuz initrd.cpio elden.dtb
          set -o pipefail
          python3 system_files/usr/libexec/armada/kshim-build-boot.py \
            --layout maintenance \
            --stock-boot stock_boot.img \
            --linux-image vmlinuz \
            --dtb elden.dtb \
            --initrd initrd.cpio \
            --runtime kShimC-fast.bin \
            --packer in/out-tools/MultiBootKernelPatcher \
            --unpacker in/out-tools/UnpackTool \
            --repacker in/out-tools/repack_boot_v4.py \
            --avbtool in/out-tools/avbtool.py \
            --bootargs "root=UUID=402b5e5a-d297-4f60-8557-8670259c662e rootflags=subvol=/root,noatime,compress=zstd:1 rw rootwait console=tty0 loglevel=7 ignore_loglevel" \
            --out out-armada 2>&1 | tail -40
          ls -la out-armada
      - uses: actions/upload-artifact@v4
        with:
          name: boot-image-armada
          path: out-armada/**
          if-no-files-found: error
